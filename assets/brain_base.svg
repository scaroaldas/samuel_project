<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2035;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Contorno principal del cerebro -->
  <path d="M 200 450 
           C 150 450, 100 400, 100 300 
           C 100 200, 150 150, 250 120 
           C 350 90, 500 100, 600 150 
           C 700 200, 750 300, 700 400 
           C 650 500, 500 520, 350 500 
           C 250 480, 220 450, 200 450 Z" 
        fill="url(#brainGrad)" stroke="#21262D" stroke-width="3" filter="url(#glow)"/>
        
  <!-- Surcos principales (líneas decorativas) -->
  <path d="M 250 150 Q 300 200 280 300 T 350 450" fill="none" stroke="#30363D" stroke-width="2" opacity="0.6"/>
  <path d="M 400 130 Q 450 200 420 300 T 500 480" fill="none" stroke="#30363D" stroke-width="2" opacity="0.6"/>
  <path d="M 550 180 Q 600 250 580 350 T 650 420" fill="none" stroke="#30363D" stroke-width="2" opacity="0.6"/>
  
  <!-- Cerebelo (parte trasera inferior) -->
  <ellipse cx="180" cy="420" rx="60" ry="40" fill="#161B22" stroke="#21262D" stroke-width="2"/>
  
  <!-- Tronco encefálico -->
  <path d="M 220 450 L 200 550 L 260 550 L 280 450 Z" fill="#161B22" stroke="#21262D" stroke-width="2"/>
</svg>